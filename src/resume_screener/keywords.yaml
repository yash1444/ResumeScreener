# Resume section headings, matched against a short, lower-cased line.
section_headings:
  skills:
    - '^(?:technical |core |key )?skills?(?: (?:&|and) \w+)?$'
    - '^core technical expertise$'
    - '^tech(?:nical)? stack$'
    - '^tools?(?: (?:&|and) \w+)?$'
    - '^technologies$'
    - '^languages?(?: known)?$'
    - '^(?:core |key )?competenc'
    - '^skills? summary$'
  projects:
    - '^(?:key |personal |academic |selected |notable )?projects?$'
    - '^project experience$'
  experience:
    - '^(?:work |professional |relevant |industrial )?experience$'
    - '^internships?$'
    - '^employment'
    - '^work history$'
    - '^open[- ]source'
  education:
    - '^education'
    - '^academic'
  certifications:
    - '^certifications?'
    - '^certificates$'
    - '^certificates (?:&|and) \w+'
    - '^achievements?'
    - '^key achievements'
    - '^awards?'
    - '^coursework'
  summary:
    - '^(?:professional |resume |career |profile )?(?:summary|profile|objectives?|about me)$'
  other:
    - '^area of interest'
    - '^co-?curricular'
    - '^career aspiration'
    - '^involvement'
    - '^find me online'
    - '^links$'
    - '^personal (?:details|information)$'
    - '^get in touch'
    - '^interests?$'
    - '^hobbies$'
    - '^references?$'
    - '^declaration$'
    - '^extra[- ]?curricular'
    - '^positions? of responsibility$'
    - '^publications?$'
    - '^volunteer'
