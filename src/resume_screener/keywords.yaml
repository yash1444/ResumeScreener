# Capabilities that make a project/experience entry an 'AI entry' (names from ai_capabilities).
ai_anchors:
  - llm_usage
  - retrieval
  - agents

# Generic words ('agent', 'orchestrat...') that only count next to an LLM/retrieval signal.
weak_agent:
  - '\bagents?\b'
  - 'orchestrat'

# Classical ML / computer vision. Counts as AI evidence only if allow_classical_ml is enabled in config.py.
