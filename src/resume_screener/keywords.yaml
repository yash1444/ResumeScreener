# Editable vocabularies used by the screening rules (no code changes needed).
#
# * Every entry is a case-insensitive Python regular expression; a category matches if ANY of its entries matches.
# * Single-quoted YAML strings are literal, so write regex backslashes as-is: '\bllms?\b'.
# * A literal single quote inside an entry is written twice: ''.
# * Use \b word boundaries for short words (e.g. '\bbert\b') or they will match inside longer words.
# * The file is validated at start-up; a bad regex or missing section stops the run with a clear message.
# * Point KEYWORDS_FILE=/path/to/other.yaml at a different file to override this one.

# ---- Eligibility: Python ----
# The word Python itself.
python_explicit:
  - '(?<![\w.])python3?(?![\w])'

# Frameworks that only exist in Python (LangChain/LlamaIndex are excluded on purpose: JS ports exist).
python_implied:
  - '\bfastapi\b'
  - '\bdjango\b'
  - '\bflask\b'
  - '\bpytorch\b'
  - '\bpandas\b'
  - '\bnumpy\b'
  - 'scikit-?learn'
  - '\bpydantic\b'
  - '\bcelery\b'
  - '\bsqlalchemy\b'
  - '\blanggraph\b'
  - 'google[- ]adk'
  - '\bstreamlit\b'
  - '\bpytest\b'
  - '\buvicorn\b'

