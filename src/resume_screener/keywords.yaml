# Verbs that show the candidate built/owned the work.
ownership_verbs:
  - '\b(?:built|implemented|designed|developed|engineered|architected|deployed|optimi[sz]ed|created|integrated|led|reduced|improved|automated|established|introduced|operationali[sz]ed|migrated|wrote)\b'

